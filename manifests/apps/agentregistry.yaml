apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentregistry-inventory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/den-vasyliev/charts
    targetRevision: 0.5.16
    chart: agentregistry
    helm:
      values: |
        image:
          tag: "0.5.18"
        disableAuth: true
  destination:
    server: https://kubernetes.default.svc
    namespace: agentregistry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
