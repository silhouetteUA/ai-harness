apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: phoenix
  namespace: argocd
spec:
  destination:
    namespace: phoenix
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: phoenix-helm
    helm:
      values: |
        auth:
          enableAuth: false
        healthChecks:
          startupProbe:
            enabled: true
            failureThreshold: 120
            initialDelaySeconds: 5
            periodSeconds: 5
        ingress:
          enabled: false
    repoURL: registry-1.docker.io/arizephoenix
    targetRevision: 12.0.10
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
