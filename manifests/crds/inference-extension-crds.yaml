apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-extension-crds
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api-inference-extension.git
    targetRevision: v1.5.0
    path: config/crd

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
