apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: main
    path: config/crd/experimental
    kustomize: {}

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true