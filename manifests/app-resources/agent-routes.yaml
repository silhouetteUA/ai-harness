apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: retrieval-routes
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agentgateway-external
    namespace: agentgateway-system
  rules:
  # Route 1: Custom implementation
  - matches:
    - path:
        type: PathPrefix
        value: /v1/retrieval/custom
    backendRefs:
    - name: gemini-backend
      namespace: agentgateway-system
      group: agentgateway.dev
      kind: AgentgatewayBackend

  # Route 2: Official implementation
  - matches:
    - path:
        type: PathPrefix
        value: /v1/retrieval/official
    backendRefs:
    - name: gemini-backend
      namespace: agentgateway-system
      group: agentgateway.dev
      kind: AgentgatewayBackend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k8s-agent-routes
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agentgateway-external
    namespace: agentgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/k8s
    backendRefs:
    - name: gemini-backend
      namespace: agentgateway-system
      group: agentgateway.dev
      kind: AgentgatewayBackend
