apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: policy-retrieval-custom
  namespace: agentgateway-system
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: retrieval-routes
  backend:
    ai:
      defaults:
        - field: "model"
          value: "gemini-1.5-flash"
---
